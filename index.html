body { font-family: Tahoma, 'Segoe UI', sans-serif; direction: rtl; background: #F7F8FC; min-height: 100vh; font-size: 14px; }

.case-card { background: #fff; border-radius: 12px; padding: 13px 15px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; box-shadow: 0 1px 6px rgba(0,0,0,0.06); margin-bottom: 9px; border-right: 4px solid #ccc; }

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, collection, getDocsFromServer, writeBatch } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCyI27I02I7-iFWnIa2mvDB1Qd3Sfr4IUs",
    authDomain: "parvande-ai.firebaseapp.com",
    projectId: "parvande-ai",
    storageBucket: "parvande-ai.firebasestorage.app",
    messagingSenderId: "329989899571",
    appId: "1:329989899571:web:6c3c2706685e36fcbcea46"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Read ALL cases — always from server, never from SDK cache
  window.cloudLoadAll = async function() {
    const snap = await getDocsFromServer(collection(db, "caseFiles"));
    const arr = [];
    snap.forEach(d => arr.push(d.data()));
    return arr;
  };

  // Write/delete cases in caseFiles collection (batched to stay under 500-op limit)
  window.cloudSaveAll = async function(toWrite, toDelete) {
    const ops = [
      ...toWrite.map(c => ({type:"set", id:c.id, data:c})),
      ...(toDelete||[]).map(id => ({type:"del", id}))
    ];
    if(ops.length === 0) return;
    for(let i=0; i<ops.length; i+=450) {
      const batch = writeBatch(db);
      ops.slice(i, i+450).forEach(op => {
        if(op.type==="set") batch.set(doc(db, "caseFiles", op.id), op.data);
        else batch.delete(doc(db, "caseFiles", op.id));
      });
      await batch.commit();
    }
  };

  // Settings (stages/lawyers/types) — small, stay in single docs
  window.cloudSaveSetting = async function(key, value) {
    await setDoc(doc(db, "data", key), { value, updatedAt: new Date().toISOString() });
  };
  window.cloudLoadSetting = async function(key) {
    const snap = await getDoc(doc(db, "data", key));
    return snap.exists() ? snap.data().value : null;
  };

  window.firebaseReady = true;
  document.dispatchEvent(new Event("firebaseReady"));
</script>

  if(window.firebaseReady) { loadCloud(); }

  // Safety timeout: if cloud takes > 8s, show what we have from localStorage

      render();
      showSyncStatus("⚠️ بدون اتصال — داده محلی", 5000);

async function loadCloud() {
  try {
    showSyncStatus("در حال بارگذاری...");

    // Load settings
    const [sv, sv2, sv3, sv4, lv, tv] = await Promise.all([
      window.cloudLoadSetting("stages"),
      window.cloudLoadSetting("stagesT2"),
      window.cloudLoadSetting("stagesT3"),
      window.cloudLoadSetting("stagesT4"),
      window.cloudLoadSetting("lawyers"),
      window.cloudLoadSetting("types")
    ]);
    if(sv) { stages=JSON.parse(sv); localStorage.setItem("pv-stages",sv); }
    if(sv2) { stagesT2=JSON.parse(sv2); localStorage.setItem("pv-stages-t2",sv2); }
    if(sv3) { stagesT3=JSON.parse(sv3); localStorage.setItem("pv-stages-t3",sv3); }
    if(sv4) { stagesT4=JSON.parse(sv4); localStorage.setItem("pv-stages-t4",sv4); }
    if(lv) { lawyersList=JSON.parse(lv); localStorage.setItem("pv-lawyers",lv); }
    if(tv) { typesList=JSON.parse(tv); localStorage.setItem("pv-types",tv); }

    // Load cases from caseFiles (one doc per case — no 1MB limit)
    const cloudCases = await window.cloudLoadAll();
    const cloudById = {};
    cloudCases.forEach(c => { cloudById[c.id] = c; });

    // Merge: keep all cloud cases + any local-only cases (in case a save failed)
    const localById = {};
    cases.forEach(c => { localById[c.id] = c; });

    const merged = { ...cloudById };
    // Add local-only cases (ID not in cloud) — these are unsaved local changes
    const localOnlyIds = [];
    cases.forEach(c => {
      if(!cloudById[c.id] && !pendingDeletes.includes(c.id)) {
        merged[c.id] = c;
        localOnlyIds.push(c.id);
      }
    });

    cases = Object.values(merged);

    // One-time repair: fix cases whose fee doesn't match their installment total
    // (older bug where installments weren't syncing to the fee field)
    let repaired = 0;
    cases = cases.map(c => {
      if(c.installments && c.installments.length > 0) {
        const correctFee = installmentsTotal(c.installments);
        if((Number(c.fee)||0) !== correctFee) { repaired++; return {...c, fee: correctFee}; }
      }
      return c;
    });

    localStorage.setItem("pv-cases", JSON.stringify(cases));

    // If we had local-only cases, upload them now
    if(localOnlyIds.length > 0) {
      const toUpload = cases.filter(c => localOnlyIds.includes(c.id));
      window.cloudSaveAll(toUpload, []).catch(e => console.error("Sync local-only:", e));
    }
    if(repaired > 0) {
      window.cloudSaveAll(cases.filter(c=>c.installments&&c.installments.length>0), []).catch(e => console.error("Repair sync:", e));
    }

    cloudSynced = true;
    render();
    showSyncStatus(`✅ ${cases.length} پرونده`, 3000);
  } catch(e) {
    console.error("loadCloud error:", e);
    cloudSynced = true;
    render();
    showSyncStatus("⚠️ خطا در اتصال — داده محلی", 4000);
  }
}

// Unified sync: merge cloud data into local, newest-wins per case (by last log date)
let syncInProgress = false;
async function syncFromCloud(silent) {
  if(syncInProgress || saveInProgress) return;
  if(!window.firebaseReady || !cloudSynced) return;
  syncInProgress = true;
  try {
    const cloudCases = await window.cloudLoadAll();
    const cloudById = {};
    cloudCases.forEach(c => { cloudById[c.id] = c; });
    const localById = {};
    cases.forEach(c => { localById[c.id] = c; });

    let added=0, updated=0;
    const merged = [...cases];

    cloudCases.forEach(cloudCase => {
      const localCase = localById[cloudCase.id];
      if(!localCase) {
        merged.push(cloudCase);
        added++;
      } else {
        const cloudDate = lastLogDate(cloudCase);
        const localDate = lastLogDate(localCase);
        if(cloudDate > localDate) {
          const idx = merged.findIndex(c=>c.id===cloudCase.id);
          if(idx>-1) merged[idx] = cloudCase;
          updated++;
        }
      }
    });

    if(added>0 || updated>0) {
      cases = merged;
      localStorage.setItem("pv-cases", JSON.stringify(cases));
      render();
      showSyncStatus(`🔄 بروزرسانی شد (${added} جدید، ${updated} آپدیت)`, 2500);
    } else if(!silent) {
      showSyncStatus("✅ به‌روزه", 1500);
    }
  } catch(e) {
    if(!silent) showSyncStatus("⚠️ خطا در sync", 2500);
  } finally {
    syncInProgress = false;
  }
}

function today() { return new Date().toISOString().split("T")[0]; }
function fmtDate(d) { if(!d) return "—"; try { return new Date(d).toLocaleDateString("fa-IR"); } catch { return d; } }
function fmtNum(n) { if(!n && n!==0) return "—"; return Number(n).toLocaleString("fa-IR"); }
function fmtPlate(c) {
  if(!c.plateFar && !c.plateAsl && !c.plateBkh) return c.plate||"—";
  return `${c.plateFar||"—"} فرعی . ${c.plateAsl||"—"} اصلی  بخش ${c.plateBkh||"—"}`;
}
function getTemplateStages(t) {
  if(t===2) return stagesT2;
  if(t===3) return stagesT3;
  if(t===4) return stagesT4;
  return stages;
}
function getCaseStages(c) { return getTemplateStages((c&&c.template)||1); }
function getStage(id) {
  const all = [...stages, ...stagesT2, ...stagesT3, ...stagesT4];
  return all.find(s=>s.id===id)||stages[0]||{color:"#ccc",bg:"#eee",label:"—"};
}
function lastActiveStageId(c) {
  const st = getCaseStages(c);
  const ids = st.map(s=>s.id);
  const active = c.activeStages || ids;
  for(let i=ids.length-1;i>=0;i--){ if(active.includes(ids[i])) return ids[i]; }
  return ids[ids.length-1];
}
function firstActiveStageId(c) {
  const st = getCaseStages(c);
  const ids = st.map(s=>s.id);
  const active = c.activeStages || ids;
  for(let i=0;i<ids.length;i++){ if(active.includes(ids[i])) return ids[i]; }
  return ids[0];
}
function getSorted(list) {
  return [...list].sort((a,b)=>{
    if(sortBy==="name") return a.name.localeCompare(b.name,"fa");
    if(sortBy==="stage") { const st=getCaseStages(a); return st.findIndex(s=>s.id===a.stage)-st.findIndex(s=>s.id===b.stage); }
    return new Date(b.receivedDate||0)-new Date(a.receivedDate||0);
  });
}

// ── Persian month name from date string
// Gregorian to Jalali conversion
function toJalali(gy,gm,gd){
  const g_d_m=[0,31,59,90,120,151,181,212,243,273,304,334];
  let jy,jm,jd,g_y_m,gy2,days;
  gy2=gm>2?gy+1:gy;
  days=355666+(365*gy)+(Math.floor((gy2+3)/4))-(Math.floor((gy2+99)/100))+(Math.floor((gy2+399)/400))+gd+g_d_m[gm-1];
  jy=Math.floor(days/365.25)-229;
  let i=0;
  while(true){
    const jyy=jy+i;
    const ls=(((jyy-474)%2820)+474+38)*682%2816<682?1:0;
    const jdays=365+ls;
    const jstart=365*(jy+i-1)+(Math.floor(((jy+i)-474)%2820*682/2816))+ Math.floor(((jy+i)-474)/2820)*1029983+1948319.5 - 1948438.5+ Math.floor(((474+(jy+i-474)%2820)*682)/ 2816)+(jy+i-474)*365+Math.floor((jy+i)/128)-Math.floor((jy+i)/2816)+Math.floor((jy+i+474)/2820)*1029983+474*2820/682 | 0;
    if(days<jstart+jdays){jy=jy+i;break;}
    i++;
    if(i>5){jy=jy+i;break;}
  }
  // simpler approach
  let l=gy-((gm<3)?1:0); let n=474+((l-474)%2820);
  jy=l-474+(Math.floor((682*n-110)/2816))+Math.floor(n/4)*1461+n*365+Math.floor((474+(l-474)%2820)*682/2816)+(l-474-(Math.floor((474+(l-474)%2820)*682/2816))+(474+(l-474)%2820)*365+Math.floor((474+(l-474)%2820)/4)-Math.floor((474+(l-474)%2820)/100)+Math.floor((474+(l-474)%2820)/400))|0;
  // use built-in Intl instead
  return null;
}

function faMonth(dateStr) {
  if(!dateStr) return "نامشخص";
  try {
    const d = new Date(dateStr);
    return d.toLocaleDateString("fa-IR-u-nu-latn",{year:"numeric",month:"long",calendar:"persian"});
  } catch { 
    try { return d.toLocaleDateString("fa-IR",{year:"numeric",month:"long"}); }
    catch { return "نامشخص"; }
  }
}
function monthKey(dateStr) {
  if(!dateStr) return "0000-00";
  try {
    const d = new Date(dateStr);
    // Get Jalali year and month using Intl
    const parts = new Intl.DateTimeFormat("fa-IR-u-nu-latn",{year:"numeric",month:"2-digit",calendar:"persian"}).formatToParts(d);
    const yr = parts.find(p=>p.type==="year")?.value||"0";
    const mo = parts.find(p=>p.type==="month")?.value||"00";
    return `${yr}-${mo}`;
  } catch {
    const d = new Date(dateStr);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
  }
}

function exportData() {
  const data = { cases, stages, stagesT2, stagesT3, stagesT4, exportedAt: new Date().toISOString(), version: 2 };
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const dateStr = new Date().toLocaleDateString("fa-IR").replace(/\//g,"-");
  a.href = url;
  a.download = `پرونده‌ها-${dateStr}.json`;
  a.click();
  URL.revokeObjectURL(url);
  localStorage.setItem("pv-last-backup", new Date().toLocaleString("fa-IR"));
  render();
}

function lastLogDate(c) {
  if(!c.logs||!c.logs.length) return c.receivedDate||"";
  return c.logs[c.logs.length-1].date||"";
}

function importData(input, mode) {
  const file = input.files[0];
  if(!file) return;
  mode = mode || 'merge';
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if(!data.cases || !Array.isArray(data.cases)) { alert("فایل معتبر نیست"); return; }
      if(mode === 'merge') {
        const localById = {};
        cases.forEach(c => { localById[c.id] = c; });
        let added=0, updated=0;
        data.cases.forEach(incoming => {
          const existing = localById[incoming.id];
          if(!existing) {
            // Brand new case — add it
            cases.push(incoming);
            added++;
          } else {
            // Same ID — pick whichever has newer last-log date
            const incomingDate = lastLogDate(incoming);
            const existingDate = lastLogDate(existing);
            if(incomingDate > existingDate) {
              cases = cases.map(c => c.id===incoming.id ? incoming : c);
              updated++;
            }
          }
        });
        if(added===0 && updated===0) { alert("هیچ تغییری پیدا نشد — همه پرونده‌ها به‌روز هستن."); return; }
        const msg = [added>0?`${added} پرونده جدید اضافه شد`:"", updated>0?`${updated} پرونده آپدیت شد`:""].filter(Boolean).join("، ");
        if(!confirm(`${msg}. اعمال بشه؟`)) return;
        if(data.stages && Array.isArray(data.stages)) {
          const existingStageIds = new Set(stages.map(s=>s.id));
          data.stages.filter(s=>!existingStageIds.has(s.id)).forEach(s=>stages.push(s));
        }
        [["stagesT2",()=>stagesT2,(v)=>stagesT2=v],["stagesT3",()=>stagesT3,(v)=>stagesT3=v],["stagesT4",()=>stagesT4,(v)=>stagesT4=v]].forEach(([key,get,set])=>{
          if(data[key] && Array.isArray(data[key])) {
            const existingIds = new Set(get().map(s=>s.id));
            const merged = [...get()];
            data[key].filter(s=>!existingIds.has(s.id)).forEach(s=>merged.push(s));
            set(merged);
          }
        });
      } else {
        if(!confirm(`${data.cases.length} پرونده بارگذاری بشه؟ همه داده‌های فعلی (${cases.length} پرونده) پاک و جایگزین میشن. این کار قابل بازگشت نیست مگر با یک پشتیبان دیگه.`)) return;
        cases = data.cases;
        if(data.stages && Array.isArray(data.stages)) stages = data.stages;
        if(data.stagesT2 && Array.isArray(data.stagesT2)) stagesT2 = data.stagesT2;
        if(data.stagesT3 && Array.isArray(data.stagesT3)) stagesT3 = data.stagesT3;
        if(data.stagesT4 && Array.isArray(data.stagesT4)) stagesT4 = data.stagesT4;
      }
      saveC(); saveS(); saveTemplateStages(2); saveTemplateStages(3); saveTemplateStages(4);
      localStorage.setItem("pv-last-backup", new Date().toLocaleString("fa-IR"));
      alert("✅ داده‌ها با موفقیت بروزرسانی شدن!");
      switchTab("cases");
    } catch(err) {
      alert("خطا در خواندن فایل: " + err.message);
    }
  };
  reader.readAsText(file);
}

function navState() {
  return {tab:currentTab, view:currentView, lawyerFilter, selectedId, filterStageId};

function pushNav() {
  navHistory.push(navState());
  if(navHistory.length > 20) navHistory.shift();
}
function goBack() {
  if(navHistory.length === 0) { switchTab("home"); return; }
  const prev = navHistory.pop();
  currentTab = prev.tab;
  currentView = prev.view;
  lawyerFilter = prev.lawyerFilter;
  selectedId = prev.selectedId;
  filterStageId = prev.filterStageId;
  render();
}
function switchTab(tab) {
  pushNav();
  currentTab=tab; currentView="board"; filterStageId=null; selectedId=null; lawyerFilter=null; searchVisible=false;
  render();
}
function goHome() {
  pushNav();
  currentTab="home"; currentView="board"; filterStageId=null; selectedId=null; lawyerFilter=null;

          </div>
          <div style="display:flex;flex-direction:column;gap:6px">${getCaseStages(c).map((st,i)=>{

            const thisIdx = stageOrder.indexOf(st.id);
            const isDone = isActive && thisIdx < currentIdx;
            const isUpcoming = isActive && thisIdx > currentIdx;
            let bg, color, border, opacity, textDeco, icon;
            if(!isActive) {
              bg="#F5F5F5"; color="#bbb"; border="1.5px solid #eee"; opacity="0.6"; textDeco="line-through"; icon="—";

              bg=st.bg; color=st.color; border=`1.5px solid ${st.color}`; opacity="0.8"; textDeco="none"; icon="✓";

                <button onclick="addStageNote('${c.id}','${st.id}')" title="افزودن توضیح" style="background:#EEF0FC;border:none;color:#6B7FD7;border-radius:8px;padding:8px 9px;cursor:pointer;font-size:12px">📝</button>
              </div>
              ${notes.length>0?`<div style="padding:4px 12px 4px 40px">
                ${notes.map((n,ni)=>`
                  <div style="display:flex;align-items:flex-start;gap:6px;padding:4px 0;border-bottom:1px solid #F5F5F5">
                    <div style="flex:1">
                      <div style="font-size:12px;color:#444">${n.text}</div>
                      <div style="font-size:10px;color:#bbb;margin-top:1px">${fmtDate(n.date)}</div>
                    </div>
                    <button onclick="editStageNote('${c.id}','${st.id}',${ni})" style="background:none;border:none;color:#6B7FD7;cursor:pointer;font-size:11px;padding:2px 4px">✏️</button>
                    <button onclick="deleteStageNote('${c.id}','${st.id}',${ni})" style="background:none;border:none;color:#E05C5C;cursor:pointer;font-size:11px;padding:2px 4px">🗑</button>
                  </div>`).join("")}
              </div>`:""}
            </div>`;
          }).join("")}</div>
          ${(() => {
            const curStage = getCaseStages(c).find(s=>s.id===c.stage);
            if(curStage && curStage.subStages && curStage.subStages.length>0) {
              const subSel = (c.subStageSelections && c.subStageSelections[c.stage]) || [];
              return `<div style="margin-top:10px;padding-top:10px;border-top:1px solid #F0F2F8">
                <div style="font-size:11px;color:#888;margin-bottom:6px">جزئیات «${curStage.label}»</div>
                <div style="display:flex;flex-wrap:wrap;gap:8px">
                  ${curStage.subStages.map(sub => `
                    <label class="check-label" style="font-size:12px">
                      <input type="checkbox" ${subSel.includes(sub)?"checked":""} onchange="toggleSubStage('${c.id}','${c.stage}','${sub}',this.checked)">
                      ${sub}
                    </label>`).join("")}
                </div>
              </div>`;
            }
            return "";
          })()}
          <div class="move-btns">
            <button class="btn btn-light" onclick="moveStage('${c.id}',-1)" ${c.stage===firstActiveStageId(c)?"disabled style='opacity:0.4'":""}>← قبلی</button>
            <button class="btn btn-primary" onclick="moveStage('${c.id}',1)" ${c.stage===lastActiveStageId(c)?"disabled style='opacity:0.4'":""}>بعدی ←</button>
          </div>
        </div>
        <div class="card">
          <div class="card-title">تاریخچه و یادداشت‌ها</div>
          <div style="margin-bottom:12px">${logsHTML}</div>
          <div class="log-input-row">
            <input type="text" id="log-input" placeholder="یادداشت امروز..." onkeydown="if(event.key==='Enter') addLog('${c.id}')">
            <button class="btn btn-primary" onclick="addLog('${c.id}')">ثبت</button>
          </div>
        </div>
      </div>${bottomNav()}`;
  }
}

function checkAutoSettle(c) {
  // If fully paid and not already at the last stage, auto-advance to last stage (and archive, like normal stage progression)
  if((Number(c.fee)||0) <= 0) return c;
  const remaining = (Number(c.fee)||0) - (Number(c.paid)||0);
  if(remaining > 0) return c;
  const lastId = lastActiveStageId(c);
  if(c.stage === lastId) return c;
  const updated = {...c, stage: lastId, logs:[...c.logs,{date:today(),text:`💯 تسویه کامل شد — پرونده به مرحله «${getStage(lastId).label}» منتقل شد`}]};
  if(!c.archivedAt) { updated.archivedAt = today(); delete updated.stalledAt; }
  return updated;
}

function moveStage(caseId,dir){
  cases=cases.map(c=>{
    if(c.id!==caseId) return c;
    const ids=getCaseStages(c).map(s=>s.id);
    const active = c.activeStages || ids;
    let idx=ids.indexOf(c.stage);
    let ni = idx;
    // Skip inactive stages
    do {
      ni += dir;
      if(ni < 0 || ni >= ids.length) { ni = Math.max(0, Math.min(ni, ids.length-1)); break; }
    } while(!active.includes(ids[ni]) && ni > 0 && ni < ids.length-1);
    if(!active.includes(ids[ni])) {
      // find nearest active stage in that direction
      let found = -1;
      for(let i=ni; dir>0 ? i<ids.length : i>=0; i+=dir) {
        if(active.includes(ids[i])) { found=i; break; }
      }
      if(found>=0) ni=found; else return c;
    }
    const ns=ids[ni];
    const isLastStage = ns === lastActiveStageId(c);
    const updated = {...c,stage:ns,logs:[...c.logs,{date:today(),text:`مرحله تغییر کرد: ${getStage(ns).label}`}]};
    if(isLastStage && !c.archivedAt) {
      updated.archivedAt = today();
      delete updated.stalledAt;
    } else if(!isLastStage && c.archivedAt) {
      // moved back out of last stage - unarchive
      delete updated.archivedAt;
    }
    return updated;
  });
  saveC();render();
}

function toggleSubStage(caseId, stageId, subName, isChecked) {
  cases = cases.map(c => {
    if(c.id !== caseId) return c;
    const allSel = c.subStageSelections || {};
    let stageSel = allSel[stageId] || [];
    if(isChecked) { if(!stageSel.includes(subName)) stageSel = [...stageSel, subName]; }
    else { stageSel = stageSel.filter(s => s !== subName); }
    return {...c, subStageSelections: {...allSel, [stageId]: stageSel}};
  });
  saveC();
  render();
}

function toggleCaseStage(caseId, stageId, isActive) {
  cases = cases.map(c => {
    if(c.id !== caseId) return c;
    let active = c.activeStages || getCaseStages(c).map(s=>s.id);
    if(isActive) { if(!active.includes(stageId)) active = [...active, stageId]; }
    else { active = active.filter(s => s !== stageId); }
    return {...c, activeStages: active};
  });
  saveC();
  render();
}

function installmentsTotal(installments) {
  return (installments||[]).reduce((s,i)=>s+(Number(i.amount)||0),0);
}

  const amount = Number(prompt("مبلغ این قسط (تومان):"))||0;
  if(amount<=0) { alert("مبلغ نامعتبر است"); return; }
  cases = cases.map(c=>{

    const updatedInst = [...(c.installments||[]), {id:Date.now().toString(), label:label.trim(), amount, paid:false, paidDate:null}];
    return {...c, installments:updatedInst, fee: installmentsTotal(updatedInst)};

function markInstallmentPaid(caseId, instId) {
  const c = cases.find(x=>x.id===caseId);
  if(!c) return;
  const inst = (c.installments||[]).find(i=>i.id===instId);
  if(!inst || inst.paid) return;
  const dateStr = prompt("تاریخ دریافت این قسط:", today());
  if(dateStr===null) return;
  cases = cases.map(x=>{
    if(x.id!==caseId) return x;
    const updatedInst = (x.installments||[]).map(i=>i.id===instId?{...i,paid:true,paidDate:dateStr||today()}:i);
    const newPaid = (Number(x.paid)||0) + inst.amount;
    return checkAutoSettle({...x, installments:updatedInst, fee: installmentsTotal(updatedInst), paid:newPaid,
      paymentHistory:[...(x.paymentHistory||[]),{date:dateStr||today(), amount:inst.amount}],
      logs:[...x.logs,{date:today(),text:`💰 قسط «${inst.label}» دریافت شد: ${fmtNum(inst.amount)} تومان`}]});
  });
  saveC(); render();

function restoreCase(caseId){

    const updated={...c,logs:[...c.logs,{date:today(),text:"پرونده به روند عادی بازگشت."}]};
    delete updated.archivedAt;
    delete updated.stalledAt;
    return updated;
  });
  saveC();render();
}

function getJalaliYear() {
  try {
    const parts = new Intl.DateTimeFormat("fa-IR-u-nu-latn",{year:"2-digit",calendar:"persian"}).formatToParts(new Date());
    return parts.find(p=>p.type==="year")?.value||"05";
  } catch { return "05"; }
}

function generateNextCode() {
  const yr = getJalaliYear();
  const prefix = `${yr}-`;
  const nums = cases
    .map(c => c.code||"")
    .filter(c => c.startsWith(prefix))
    .map(c => parseInt(c.replace(prefix,""))||0)
    .filter(n => !isNaN(n));
  const max = nums.length > 0 ? Math.max(...nums) : 0;
  const next = String(max + 1).padStart(3, "0");
  return `${prefix}${next}`;
}

function generateNextCaseNo() {
  const yr = getJalaliYear();
  const prefix = `پ-${yr}-`;
  const nums = cases
    .map(c => c.caseNo||"")
    .filter(c => c.startsWith(prefix))
    .map(c => parseInt(c.replace(prefix,""))||0)
    .filter(n => !isNaN(n));
  const max = nums.length > 0 ? Math.max(...nums) : 0;
  const next = String(max + 1).padStart(3, "0");
  return `${prefix}${next}`;
}

  const tpl = TEMPLATE_META[newSelectedTemplate];

function renderTypeBtns(containerId,prefix){

    newTypeSelected = newTypeSelected.includes(t) ? newTypeSelected.filter(x=>x!==t) : [...newTypeSelected, t];

  } else {
    editTypeSelected = editTypeSelected.includes(t) ? editTypeSelected.filter(x=>x!==t) : [...editTypeSelected, t];

  }

function promptAddType(prefix){
  const name = prompt("نام نوع جدید را وارد کن:");
  if(!name || !name.trim()) return;
  const t = name.trim();
  if(!typesList.includes(t)){ typesList.push(t); saveTypes(); }
  if(prefix==="new"){ if(!newTypeSelected.includes(t)) newTypeSelected=[...newTypeSelected,t]; renderTypeBtns("new-type-btns","new"); }

<script>
function openArchive() {
  pushNav();
  currentTab = "archive";
  render();
}

function renderArchive() {
  const app = document.getElementById("app");
  const archived = cases.filter(c=>c.archivedAt);
  // Group by Jalali year
  const yearMap = {};
  archived.forEach(c => {
    let yr = "نامشخص";
    try {
      const parts = new Intl.DateTimeFormat("fa-IR-u-nu-latn",{year:"numeric",calendar:"persian"}).formatToParts(new Date(c.archivedAt));
      yr = parts.find(p=>p.type==="year")?.value || "نامشخص";
    } catch {}
    if(!yearMap[yr]) yearMap[yr] = [];
    yearMap[yr].push(c);
  });
  const years = Object.keys(yearMap).sort((a,b)=>b.localeCompare(a));
  years.forEach(y => yearMap[y].sort((a,b)=> new Date(b.archivedAt) - new Date(a.archivedAt)));

  app.innerHTML = `
    <div class="header">
      <div style="display:flex;align-items:center;gap:8px">
        <button class="btn btn-ghost" onclick="goBack()">← برگشت</button>
        <div class="header-title">📦 آرشیو پایان‌یافته‌ها</div>
      </div>
      <div style="font-size:12px;opacity:0.8">${archived.length} پرونده</div>
    </div>
    <div class="content">
      ${years.length===0?'<div class="empty">هنوز پرونده‌ای بایگانی نشده.</div>':years.map(y=>`
        <div style="font-weight:700;font-size:15px;color:#1E2A4A;margin:14px 0 8px">سال ${y}</div>
        ${yearMap[y].map(c=>`<div onclick="openCase('${c.id}')">${caseCardHTML(c)}</div>`).join("")}
      `).join("")}
    </div>${bottomNav()}`;
}

  currentTab = "archiveStalled";
  render();
}

  const stalled = getSorted(cases.filter(c=>c.stalledAt)).sort((a,b)=> new Date(b.stalledAt)-new Date(a.stalledAt));

      <div style="font-size:12px;opacity:0.8">${stalled.length} پرونده</div>
    </div>
    <div class="content">
